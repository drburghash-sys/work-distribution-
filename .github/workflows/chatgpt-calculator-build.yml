name: Build Floating Calculator APK
on:
  push:
    branches:
      - 'chatgpt-calculator-*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare v1.2 source
        run: |
          base64 -d calculator_source.b64 > calculator.zip
          unzip -q calculator.zip
          cp calculator-patch/MainActivity.java FloatingCalculator/app/src/main/java/com/bms/floatingcalculator/MainActivity.java
          cp calculator-patch/CalculatorPanel.java FloatingCalculator/app/src/main/java/com/bms/floatingcalculator/CalculatorPanel.java
          mkdir -p FloatingCalculator/app/src/main/res/drawable
          cp calculator-icon/ic_launcher.xml FloatingCalculator/app/src/main/res/drawable/ic_launcher.xml
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("FloatingCalculator/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          if 'android:icon=' not in s:
              s = s.replace('android:allowBackup="true"', 'android:allowBackup="true"\n        android:icon="@drawable/ic_launcher"\n        android:roundIcon="@drawable/ic_launcher"')
          manifest.write_text(s)

          gradle = Path("FloatingCalculator/app/build.gradle")
          g = gradle.read_text()
          g = g.replace("versionCode 1", "versionCode 3")
          g = g.replace("versionName '1.0'", "versionName '1.2'")
          gradle.write_text(g)
          PY
      - name: Build APK
        working-directory: FloatingCalculator
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BMS-Floating-Calculator-v1.2
          path: FloatingCalculator/app/build/outputs/apk/debug/app-debug.apk
