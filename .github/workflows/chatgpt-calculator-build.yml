name: Build Floating Calculator APK
on:
  push:
    branches:
      - 'chatgpt-calculator-*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Decode source
        run: |
          base64 -d calculator_source.b64 > calculator.zip
          unzip -q calculator.zip
          cp calculator-patch/MainActivity.java FloatingCalculator/app/src/main/java/com/bms/floatingcalculator/MainActivity.java
          cp calculator-patch/CalculatorPanel.java FloatingCalculator/app/src/main/java/com/bms/floatingcalculator/CalculatorPanel.java
          sed -i "s/versionCode 1/versionCode 2/" FloatingCalculator/app/build.gradle
          sed -i "s/versionName '1.0'/versionName '1.1'/" FloatingCalculator/app/build.gradle
      - name: Build APK
        working-directory: FloatingCalculator
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FloatingCalculator-APK-v1.1
          path: FloatingCalculator/app/build/outputs/apk/debug/app-debug.apk
