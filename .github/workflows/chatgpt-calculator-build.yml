name: Build Floating Calculator APK
on:
  push:
    branches:
      - 'chatgpt-calculator-*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Decode source
        run: |
          base64 -d calculator_source.b64 > calculator.zip
          unzip -q calculator.zip
      - name: Build APK
        working-directory: FloatingCalculator
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FloatingCalculator-APK
          path: FloatingCalculator/app/build/outputs/apk/debug/app-debug.apk
